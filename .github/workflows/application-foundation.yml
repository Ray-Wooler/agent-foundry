name: Application Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-foundation:
    name: Application Foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://foundry:foundry@localhost:5432/foundry
      API_PORT: "3001"
      WEB_PORT: "3000"
      API_PUBLIC_URL: http://localhost:3001
      WEB_PUBLIC_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: phase1-test-password
      BOOTSTRAP_WORKSPACE_NAME: Test Workspace
      SESSION_TTL_HOURS: "1"
      WORKER_POLL_MS: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Execute web API worker vertical slice
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @agent-foundry/api start > /tmp/foundry-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @agent-foundry/worker start > /tmp/foundry-worker.log 2>&1 &
          WORKER_PID=$!
          pnpm --filter @agent-foundry/web start > /tmp/foundry-web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill "$API_PID" "$WORKER_PID" "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "--- API log ---"; cat /tmp/foundry-api.log || true
              echo "--- Worker log ---"; cat /tmp/foundry-worker.log || true
              echo "--- Web log ---"; cat /tmp/foundry-web.log || true
              exit 1
            fi
            sleep 0.5
          done

          node scripts/test_phase1_vertical.mjs
