name: Authority Resolver

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/authority/**"
      - "packages/domain/**"
      - "docs/architecture/ADR-0007-RUNTIME-AUTHORITY-RESOLVER-CORE.md"
      - ".github/workflows/authority-resolver.yml"

permissions:
  contents: read

jobs:
  authority-resolver:
    name: Authority Resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
      - name: Verify deterministic authority resolver
        run: pnpm --filter @agent-foundry/authority test
