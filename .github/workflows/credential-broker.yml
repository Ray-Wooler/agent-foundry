name: Credential Broker

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/credentials/**"
      - "packages/enforcement/**"
      - "packages/authority/**"
      - "packages/domain/**"
      - "packages/db/**"
      - "migrations/0013_credential_broker_audit.sql"
      - "scripts/test_credential_broker.mjs"
      - "docs/architecture/ADR-0010-CREDENTIAL-BROKER-CORE.md"
      - ".github/workflows/credential-broker.yml"

permissions:
  contents: read

jobs:
  credential-broker:
    name: Credential Broker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://foundry:foundry@localhost:5432/foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
      - name: Verify broker unit and adversarial tests
        run: pnpm --filter @agent-foundry/credentials test
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Verify durable credential-broker integration
        run: node scripts/test_credential_broker.mjs
