name: Evaluation Integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "schemas/evaluation/**"
      - "scripts/validate_evaluation.py"
      - "tests/fixtures/evaluation/**"

permissions:
  contents: read

jobs:
  evaluation-integrity:
    name: Evaluation Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-validation.txt
      - name: Validate evaluation suite
        run: python scripts/validate_evaluation.py --kind suite tests/fixtures/evaluation/1.0/agr-0001-boundary-suite.json
      - name: Validate accepted evaluation run
        run: python scripts/validate_evaluation.py --kind run tests/fixtures/evaluation/1.0/valid-run-pass.json
      - name: Execute AGR-0001 boundary evaluation
        run: |
          mkdir -p agents/AGR-0001-automation-governance-architect/evaluations/EVR-AGR-0001-0001
          python scripts/evaluate_agr0001_boundary.py \
            --response agents/AGR-0001-automation-governance-architect/evaluations/EVR-AGR-0001-0001/response.json \
            --out agents/AGR-0001-automation-governance-architect/evaluations/EVR-AGR-0001-0001/run.generated.json
          python scripts/validate_evaluation.py --kind run \
            agents/AGR-0001-automation-governance-architect/evaluations/EVR-AGR-0001-0001/run.generated.json
      - name: Assert invalid evaluation runs fail
        shell: bash
        run: |
          set -euo pipefail
          for fixture in tests/fixtures/evaluation/1.0/invalid-run-*.json; do
            if python scripts/validate_evaluation.py --kind run "$fixture"; then
              echo "Expected evaluation validation failure: $fixture"
              exit 1
            fi
          done
