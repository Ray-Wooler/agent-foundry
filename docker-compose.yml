services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - foundry-postgres:/var/lib/postgresql/data

volumes:
  foundry-postgres:
